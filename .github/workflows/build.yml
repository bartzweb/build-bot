name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (dari bot)'
        required: true
        type: string
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'release'
        type: string
      release_url:
        description: 'URL release GitHub'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo ${{ github.repository }} \
            --pattern "*.zip" \
            --dir ./input

      - name: Extract ZIP
        run: |
          mkdir -p ./project
          unzip -q ./input/*.zip -d ./project
          ls -la ./project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK
        working-directory: ./project
        run: |
          flutter pub get
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: ./project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
